name: Build & Release Windows (.exe)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (.exe & .msi)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Rust Stable Toolchain (MSVC x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust Build Artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Frontend Unit Tests (Vitest)
        run: pnpm test

      - name: Run Backend Rust Tests (SQLite, ESC/POS, LAN)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Read Application Version (SemVer Lockstep)
        id: app_version
        shell: pwsh
        run: |
          $ver = node -p "require('./package.json').version"
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building Kassio v$ver"

      - name: Build Tauri Windows Application (.exe & .msi)
        run: pnpm tauri build

      - name: Upload Windows Installer & Portable .exe Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kassio-v${{ steps.app_version.outputs.version }}-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/kassio.exe
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: "Kassio v${{ steps.app_version.outputs.version }} — Windows 10/11 (64-bit)"
          body: |
            ## Kassio v${{ steps.app_version.outputs.version }} (Windows 10/11 64-bit)

            Aplikasi Point-of-Sale (Kasir) Ritel Minimarket Desktop dengan arsitektur **Dual-Mode LAN (`Server Terminal` & `Client Terminal`)**, **SQLite WAL Atomic**, dan **Raw ESC/POS Thermal Printer**.

            ### Pilihan File Unduhan:
            1. **`Kassio_${{ steps.app_version.outputs.version }}_x64-setup.exe` (Direkomendasikan)** — Installer standar Windows (NSIS).
            2. **`Kassio_${{ steps.app_version.outputs.version }}_x64_en-US.msi`** — Paket installer Windows MSI.
            3. **`kassio.exe`** — File *portable executable* (dapat langsung dijalankan tanpa instalasi pada Windows 10/11 yang sudah memiliki Microsoft Edge WebView2).

            Lihat detail perubahan lengkap pada [`CHANGELOG.md`](https://github.com/bimadevs/pos-kasir/blob/main/CHANGELOG.md).
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/kassio.exe
